spring.application.name=Backend
spring.datasource.url=jdbc:mysql://${MYSQL_IP:localhost}:3306/${MYSQL_DATABASE:timetable_db}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:timetable_user}
spring.datasource.password=${MYSQL_PASSWORD:change_me_db_password}

# Flyway
spring.flyway.enabled=true

# Server
server.port=${TIMETABLE_API_PORT:8080}

# JWT defaults (Base64 secret - override via JWT_SECRET in production)
jwt.secret=${JWT_SECRET:Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1mb3ItcHJvZHVjdGlvbi1taW4tMzItYnl0ZXM=}
jwt.expiration-ms=3600000

# Timefold Solver configuration
timefold.solver.termination.spent-limit=10s
timefold.solver.environment-mode=REPRODUCIBLE